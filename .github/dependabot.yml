version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  - package-ecosystem: maven
    directory: "dusseldorf-ktor-testapp/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      kafka-major:
        patterns:
          - "org.apache.kafka:*"
        update-types:
          - "major"
      maven-test-app:
        patterns:
          - "*"
        exclude-patterns:
          - "no.nav*"
          - "org.apache.kafka:*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "*"
