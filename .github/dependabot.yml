version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "org.apache.kafka:*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: maven
    directory: "dusseldorf-ktor-testapp/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "org.apache.kafka:*"
        update-types:
          - "version-update:semver-major"
    groups:
      maven-test-app:
        patterns:
          - "*"
        exclude-patterns:
          - "no.nav*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "*"
