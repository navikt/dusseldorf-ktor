version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "no.nav*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: maven
    directory: "dusseldorf-ktor-testapp/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      maven-test-app-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "no.nav*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "*"
